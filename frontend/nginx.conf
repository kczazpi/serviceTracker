server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time (variable in proxy_pass) means nginx
    # still starts if the API container isn't reachable yet, instead of failing with "host not found".
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://dotnet:4001;

    # Same origin as the app, so the browser needs no CORS configuration.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: unknown paths get index.html (never cached, so a new deploy is picked up).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
